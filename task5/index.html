<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Симон говорит</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <a href="../index.html">← Все лабораторные</a>
  <main>
    <h1>Симон говорит</h1>
    <p>Запомните порядок подсветки и повторите его.</p>
    <p id="level">Уровень: 0</p>
    <div class="board">
      <button type="button" aria-label="Красная кнопка" disabled>1</button>
      <button type="button" aria-label="Синяя кнопка" disabled>2</button>
      <button type="button" aria-label="Зелёная кнопка" disabled>3</button>
      <button type="button" aria-label="Жёлтая кнопка" disabled>4</button>
    </div>
    <button id="start" type="button">Старт</button>
    <p id="status" role="status">Нажмите «Старт».</p>
  </main>
</body>
</html>
